name: Identity and workshop regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:emulators
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1-emulator-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
